name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # resources/dsh 是 gitignore 的本地生成物（node.exe + pnpm.exe + dsh 依赖），
      # 打包前必须生成，否则 extraResources 缺失、应用内 DSH 报「运行时不可用」
      - name: Build DSH runtime
        run: npm run build:dsh

      - name: Smoke test DSH runtime
        run: node scripts/validate-dsh-integ.mjs

      - run: npm run dist:ci

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ZDNotes-Setup-*.exe
            release/ZDNotes-Setup-*.exe.blockmap
            release/latest.yml
          generate_release_notes: true
